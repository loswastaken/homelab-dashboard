<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · los.dev Homelab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font-ui:   'Outfit', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --bg-app:    oklch(0.155 0.012 150);
      --bg-card:   oklch(0.21 0.014 152);
      --bg-input:  oklch(0.145 0.01 150);
      --glow:      radial-gradient(1100px 520px at 14% -10%, oklch(0.26 0.03 158 / .45), transparent 60%);
      --t-body:    oklch(0.95 0.01 150);
      --t-desc:    oklch(0.78 0.01 150);
      --t-mono:    oklch(0.74 0.01 150);
      --ok:        oklch(0.80 0.13 158);
      --on-green:  oklch(0.22 0.04 158);
      --down-tint: oklch(0.80 0.13 25 / .14);
      --down-text: oklch(0.86 0.11 25);
      --hairline:  inset 0 1px 0 oklch(1 0 0 / .05);
      --edge:      inset 0 0 0 1px oklch(1 0 0 / .07);
      --edge-hi:   inset 0 0 0 1px oklch(0.80 0.13 158 / .5);
      --spring:    cubic-bezier(.34, 1.56, .64, 1);
    }
    html { background: var(--bg-app); }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: var(--glow), var(--bg-app); color: var(--t-body);
      font-family: var(--font-ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }

    .card {
      width: min(400px, calc(100vw - 32px)); padding: 34px 32px; border-radius: 30px;
      background: var(--bg-card); box-shadow: var(--hairline);
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
    .brand-tile {
      width: 40px; height: 40px; flex: none; border-radius: 14px;
      background: linear-gradient(150deg, oklch(0.80 0.13 158), oklch(0.72 0.12 190));
      display: flex; align-items: center; justify-content: center;
      font: 700 14px var(--font-mono); color: oklch(0.20 0.03 158);
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-name { font-size: 15px; font-weight: 600; }
    .brand-sub { font: 400 11px var(--font-mono); color: var(--t-mono); }

    h1 { font-size: 25px; font-weight: 300; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 7px; }
    h1 b { font-weight: 700; }
    .sub { font: 400 11.5px var(--font-mono); color: var(--t-mono); margin-bottom: 26px; }

    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    label { font-size: 13.5px; font-weight: 600; }
    input {
      width: 100%; padding: 13px 16px; border-radius: 18px; border: none; outline: none;
      background: var(--bg-input); box-shadow: var(--edge); color: var(--t-body);
      font: 400 14px var(--font-ui); transition: box-shadow .18s;
    }
    input[type="password"] { font-family: var(--font-mono); }
    input:hover, input:focus { box-shadow: var(--edge-hi); }
    input::placeholder { font-family: var(--font-mono); font-size: 13px; color: var(--t-mono); opacity: .7; }
    input:-webkit-autofill {
      -webkit-box-shadow: var(--edge), inset 0 0 0 1000px var(--bg-input);
      -webkit-text-fill-color: var(--t-body); caret-color: var(--t-body);
    }
    input:-webkit-autofill:hover, input:-webkit-autofill:focus {
      -webkit-box-shadow: var(--edge-hi), inset 0 0 0 1000px var(--bg-input);
    }

    .btn {
      width: 100%; margin-top: 8px; padding: 13px; border-radius: 18px; border: none; cursor: pointer;
      background: var(--ok); color: var(--on-green); font: 700 14px var(--font-ui); line-height: 1.2;
      transition: transform .2s var(--spring), opacity .16s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn:focus-visible { outline: 2px solid var(--ok); outline-offset: 3px; }
    .btn:disabled { opacity: .5; cursor: default; transform: none; }

    .error {
      display: none; margin-top: 14px; padding: 11px 14px; border-radius: 16px;
      background: var(--down-tint); color: var(--down-text); font-size: 12.5px;
    }
    .error.show { display: block; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      .btn:hover:not(:disabled), .btn:active:not(:disabled) { transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-tile">ls</div>
      <div class="brand-text">
        <div class="brand-name">los.dev</div>
        <div class="brand-sub">homelab</div>
      </div>
    </div>

    <h1>Welcome <b>back.</b></h1>
    <p class="sub">Sign in to access your dashboard</p>

    <form onsubmit="login(event)">
      <div class="field">
        <label>Username</label>
        <input id="username" type="text" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn" id="btn" type="submit">Sign In</button>
    </form>

    <div class="error" id="err"></div>
  </div>

  <script>
    async function login(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      err.classList.remove('show');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          err.textContent = data.error || 'Login failed';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (e) {
        err.textContent = 'Could not reach the server. Check your connection and try again.';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
