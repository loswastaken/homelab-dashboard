<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup · los.dev Homelab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font-ui:   'Outfit', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --bg-app:    oklch(0.155 0.012 150);
      --bg-card:   oklch(0.21 0.014 152);
      --bg-input:  oklch(0.145 0.01 150);
      --glow:      radial-gradient(1100px 520px at 14% -10%, oklch(0.26 0.03 158 / .45), transparent 60%);
      --t-body:    oklch(0.95 0.01 150);
      --t-desc:    oklch(0.78 0.01 150);
      --t-mono:    oklch(0.74 0.01 150);
      --ok:        oklch(0.80 0.13 158);
      --warn:      oklch(0.80 0.13 75);
      --down:      oklch(0.80 0.13 25);
      --ok-text:   oklch(0.86 0.11 158);
      --warn-text: oklch(0.86 0.11 75);
      --down-text: oklch(0.86 0.11 25);
      --on-green:  oklch(0.22 0.04 158);
      --warn-tint: oklch(0.80 0.13 75 / .14);
      --down-tint: oklch(0.80 0.13 25 / .14);
      --bar-empty: oklch(1 0 0 / .08);
      --hairline:  inset 0 1px 0 oklch(1 0 0 / .05);
      --edge:      inset 0 0 0 1px oklch(1 0 0 / .07);
      --edge-hi:   inset 0 0 0 1px oklch(0.80 0.13 158 / .5);
      --spring:    cubic-bezier(.34, 1.56, .64, 1);
    }
    html { background: var(--bg-app); }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: var(--glow), var(--bg-app); color: var(--t-body);
      font-family: var(--font-ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }

    .card {
      width: min(400px, calc(100vw - 32px)); padding: 34px 32px; border-radius: 30px;
      background: var(--bg-card); box-shadow: var(--hairline);
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
    .brand-tile {
      width: 40px; height: 40px; flex: none; border-radius: 14px;
      background: linear-gradient(150deg, oklch(0.80 0.13 158), oklch(0.72 0.12 190));
      display: flex; align-items: center; justify-content: center;
      font: 700 14px var(--font-mono); color: oklch(0.20 0.03 158);
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-name { font-size: 15px; font-weight: 600; }
    .brand-sub { font: 400 11px var(--font-mono); color: var(--t-mono); }

    .chip {
      display: inline-flex; align-items: center; padding: 6px 13px; border-radius: 99px;
      background: var(--warn-tint); color: var(--warn-text);
      font: 700 10.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 { font-size: 25px; font-weight: 300; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 7px; }
    h1 b { font-weight: 700; }
    .sub { font: 400 11.5px/1.6 var(--font-mono); color: var(--t-mono); margin-bottom: 26px; }

    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    label { font-size: 13.5px; font-weight: 600; }
    label span { font-weight: 400; color: var(--t-desc); }
    input {
      width: 100%; padding: 13px 16px; border-radius: 18px; border: none; outline: none;
      background: var(--bg-input); box-shadow: var(--edge); color: var(--t-body);
      font: 400 14px var(--font-ui); transition: box-shadow .18s;
    }
    input[type="password"] { font-family: var(--font-mono); }
    input:hover, input:focus { box-shadow: var(--edge-hi); }
    input::placeholder { font-family: var(--font-mono); font-size: 13px; color: var(--t-mono); opacity: .7; }
    input:-webkit-autofill {
      -webkit-box-shadow: var(--edge), inset 0 0 0 1000px var(--bg-input);
      -webkit-text-fill-color: var(--t-body); caret-color: var(--t-body);
    }
    input:-webkit-autofill:hover, input:-webkit-autofill:focus {
      -webkit-box-shadow: var(--edge-hi), inset 0 0 0 1000px var(--bg-input);
    }

    .strength { display: flex; gap: 4px; }
    .str-bar { flex: 1; height: 4px; border-radius: 99px; background: var(--bar-empty); transition: background .2s; }
    .hint { font: 400 11px var(--font-mono); color: var(--t-mono); margin-top: -2px; }

    .btn {
      width: 100%; margin-top: 8px; padding: 13px; border-radius: 18px; border: none; cursor: pointer;
      background: var(--ok); color: var(--on-green); font: 700 14px var(--font-ui); line-height: 1.2;
      transition: transform .2s var(--spring), opacity .16s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn:focus-visible { outline: 2px solid var(--ok); outline-offset: 3px; }
    .btn:disabled { opacity: .5; cursor: default; transform: none; }

    .msg { display: none; margin-top: 14px; padding: 11px 14px; border-radius: 16px; font-size: 12.5px; }
    .msg.error { background: var(--down-tint); color: var(--down-text); }
    .msg.show { display: block; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      .btn:hover:not(:disabled), .btn:active:not(:disabled) { transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-tile">ls</div>
      <div class="brand-text">
        <div class="brand-name">los.dev</div>
        <div class="brand-sub">homelab</div>
      </div>
    </div>

    <div class="chip">First-time setup</div>

    <h1>Create your <b>account.</b></h1>
    <p class="sub">This runs once. Set your admin credentials — you'll use these to sign in every time.</p>

    <form onsubmit="setup(event)">
      <div class="field">
        <label>Your name <span>(shown in greeting)</span></label>
        <input id="displayName" type="text" placeholder="Alex">
      </div>
      <div class="field">
        <label>Username</label>
        <input id="username" type="text" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••"
          autocomplete="new-password" required oninput="updateStrength(this.value)">
        <div class="strength">
          <div class="str-bar" id="s1"></div>
          <div class="str-bar" id="s2"></div>
          <div class="str-bar" id="s3"></div>
          <div class="str-bar" id="s4"></div>
        </div>
        <div class="hint" id="str-hint">Minimum 8 characters</div>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input id="confirm" type="password" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <button class="btn" id="btn" type="submit">Create Account</button>
    </form>

    <div class="msg error" id="err"></div>
  </div>

  <script>
    function updateStrength(pw) {
      const bars   = [s1, s2, s3, s4];
      const hint   = document.getElementById('str-hint');
      let score    = 0;
      if (pw.length >= 8)  score++;
      if (pw.length >= 12) score++;
      if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
      if (/[0-9!@#$%^&*]/.test(pw)) score++;

      const colors     = ['var(--down)', 'var(--warn)', 'var(--warn)', 'var(--ok)'];
      const textColors = ['var(--down-text)', 'var(--warn-text)', 'var(--warn-text)', 'var(--ok-text)'];
      const labels     = ['Too short', 'Weak', 'Fair', 'Strong'];

      bars.forEach((b, i) => {
        b.style.background = i < score ? colors[Math.min(score - 1, 3)] : 'var(--bar-empty)';
      });
      hint.textContent = pw.length === 0 ? 'Minimum 8 characters' : labels[Math.min(score, 3)];
      hint.style.color = score > 0 ? textColors[Math.min(score - 1, 3)] : 'var(--t-mono)';
    }

    async function setup(e) {
      e.preventDefault();
      const err = document.getElementById('err');
      const btn = document.getElementById('btn');
      err.classList.remove('show');

      const displayName = document.getElementById('displayName').value.trim();
      const username    = document.getElementById('username').value.trim();
      const password    = document.getElementById('password').value;
      const confirm     = document.getElementById('confirm').value;

      if (password !== confirm) {
        err.textContent = 'Passwords do not match';
        err.classList.add('show');
        return;
      }
      if (password.length < 8) {
        err.textContent = 'Password must be at least 8 characters';
        err.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, displayName }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          err.textContent = data.error || 'Setup failed';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      } catch {
        err.textContent = 'Connection error — is the server running?';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
