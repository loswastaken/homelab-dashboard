<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homelab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=__V__">
  <link rel="stylesheet" href="/screens/uptime.css?v=__V__">
  <link rel="stylesheet" href="/screens/status.css?v=__V__">
  <link rel="stylesheet" href="/screens/settings.css?v=__V__">
  <script src="/push-client.js?v=__V__" defer></script>
</head>
<body>

<div class="page">
  <div class="shell">

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- ══════════════ SIDEBAR (rendered by app.js) ══════════════ -->
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="brand" id="brand" title="Toggle navigation">
        <div class="brand-tile" id="brand-tile">ls</div>
        <div class="brand-text">
          <span class="brand-name" id="brand-name">Homelab</span>
          <span class="brand-sub">homelab</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="folders" id="folders"></div>
      <div class="side-foot">
        <div class="server-card" id="server-card">
          <span class="server-name" id="server-name">Homelab Server</span>
          <span class="server-meta" id="server-meta">—</span>
        </div>
        <button class="signout" id="signout" title="Sign out">
          <span class="signout-label">Sign out </span>→
        </button>
      </div>
    </aside>

    <!-- ══════════════ MAIN ══════════════ -->
    <main class="main" id="main">
      <div class="screen" id="screen"></div>
    </main>

  </div>
</div>

<div id="modal-root"></div>
<div class="toasts" id="toasts"></div>

<script src="/app.js?v=__V__"></script>
<script src="/screens/dashboard.js?v=__V__"></script>
<script src="/screens/uptime.js?v=__V__"></script>
<script src="/screens/status.js?v=__V__"></script>
<script src="/screens/settings.js?v=__V__"></script>
<script>App.boot();</script>
</body>
</html>
