<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Tokens copied from /app.css (this page is served without a session and
       cannot load the auth-gated stylesheet). Keep the values in sync. */
    :root {
      --font-ui:   'Outfit', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      --ok:      oklch(0.80 0.13 158);
      --warn:    oklch(0.80 0.13 75);
      --down:    oklch(0.80 0.13 25);
      --maint:   oklch(0.80 0.13 265);
      --pending: oklch(0.80 0.13 220);
      --on-green: oklch(0.22 0.04 158);

      --bg-app:     oklch(0.155 0.012 150);
      --bg-inset:   oklch(0.13 0.008 150);
      --bg-panel:   oklch(0.19 0.012 152);
      --bg-sidebar: oklch(0.21 0.014 152);
      --bg-well:    oklch(0 0 0 / .22);
      --glow:       radial-gradient(1100px 520px at 14% -10%, oklch(0.26 0.03 158 / .45), transparent 60%);

      --ov-035: oklch(1 0 0 / .035);
      --ov-05:  oklch(1 0 0 / .05);
      --ov-06:  oklch(1 0 0 / .06);
      --ov-07:  oklch(1 0 0 / .07);
      --ov-10:  oklch(1 0 0 / .10);
      --ov-11:  oklch(1 0 0 / .11);

      --t-body:  oklch(0.95 0.01 150);
      --t-strong:oklch(0.88 0.01 150);
      --t-nav:   oklch(0.82 0.01 150);
      --t-sec:   oklch(0.80 0.01 150);
      --t-desc:  oklch(0.78 0.01 150);
      --t-faint: oklch(0.76 0.01 150);
      --t-mono:  oklch(0.74 0.01 150);

      --hairline: inset 0 1px 0 oklch(1 0 0 / .05);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg-app); }
    body {
      min-height: 100vh;
      background: var(--glow), var(--bg-app);
      color: var(--t-body);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    a { color: oklch(0.86 0.11 158); text-decoration: none; }
    a:hover { color: oklch(0.92 0.09 158); }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

    @keyframes hl-pulse {
      0%   { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
      70%  { box-shadow: 0 0 0 7px rgba(0,0,0,0); opacity: .85; }
      100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); opacity: 1; }
    }
    @keyframes hl-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes hl-spin { to { transform: rotate(360deg); } }

    /* ─── Frame ─────────────────────────────────────────────────────────── */
    main {
      max-width: 760px; margin: 0 auto; padding: 44px 24px 88px;
      display: flex; flex-direction: column; gap: 20px;
      animation: hl-in .3s ease both;
    }
    .caption { font: 500 9.5px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--t-mono); }
    .rule { flex: 1; height: 1px; background: var(--ov-07); min-width: 12px; }
    .hint { font-size: 12.5px; color: var(--t-faint); }
    .mono { font-family: var(--font-mono); }

    /* ─── Banner ────────────────────────────────────────────────────────── */
    .banner {
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
      padding: 16px 20px; border-radius: 22px;
      background: oklch(0.80 0.13 158 / .10); box-shadow: inset 0 0 0 1px oklch(0.80 0.13 158 / .22);
    }
    .banner-dot { width: 13px; height: 13px; flex: none; border-radius: 99px; background: var(--ok); color: var(--ok); animation: hl-pulse 2.4s ease-out infinite; }
    .banner-msg { flex: 1 1 200px; min-width: 0; font-size: 18px; font-weight: 600; color: oklch(0.90 0.06 158); line-height: 1.2; }
    .banner-meta { font: 400 11.5px var(--font-mono); color: var(--t-faint); white-space: nowrap; }
    .banner.degraded { background: oklch(0.80 0.13 75 / .10); box-shadow: inset 0 0 0 1px oklch(0.80 0.13 75 / .22); }
    .banner.degraded .banner-dot { background: var(--warn); color: var(--warn); }
    .banner.degraded .banner-msg { color: oklch(0.90 0.06 75); }
    .banner.outage { background: oklch(0.80 0.13 25 / .10); box-shadow: inset 0 0 0 1px oklch(0.80 0.13 25 / .22); }
    .banner.outage .banner-dot { background: var(--down); color: var(--down); }
    .banner.outage .banner-msg { color: oklch(0.90 0.06 25); }
    .banner.maintenance { background: oklch(0.80 0.13 265 / .10); box-shadow: inset 0 0 0 1px oklch(0.80 0.13 265 / .22); }
    .banner.maintenance .banner-dot { background: var(--maint); color: var(--maint); }
    .banner.maintenance .banner-msg { color: oklch(0.90 0.06 265); }

    /* ─── Title ─────────────────────────────────────────────────────────── */
    .page-hdr { text-align: center; display: flex; flex-direction: column; gap: 6px; padding: 6px 0 2px; }
    .page-hdr h1 { font-size: 26px; font-weight: 600; letter-spacing: -.015em; line-height: 1.15; overflow-wrap: anywhere; }
    .page-hdr p { font-size: 14px; color: var(--t-sec); max-width: 560px; margin: 0 auto; overflow-wrap: anywhere; }

    /* ─── Controls ──────────────────────────────────────────────────────── */
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .refreshed { margin-right: auto; font: 400 11.5px var(--font-mono); color: var(--t-mono); min-height: 1.2em; }
    .seg-group { display: flex; gap: 5px; padding: 5px; border-radius: 99px; background: var(--bg-well); }
    .seg-opt {
      padding: 8px 16px; border-radius: 99px; font-size: 12.5px; font-weight: 700;
      background: transparent; color: var(--t-nav); transition: all .2s var(--spring);
    }
    .seg-opt:hover { transform: translateY(-1px); }
    .seg-opt.active { background: var(--ok); color: var(--on-green); }
    .refresh-btn {
      width: 38px; height: 38px; border-radius: 99px; background: var(--ov-06); color: var(--t-body);
      display: inline-flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1;
      transition: background .16s, transform .2s var(--spring);
    }
    .refresh-btn:hover:not(:disabled) { background: var(--ov-11); transform: translateY(-1px); }
    .refresh-btn:disabled { cursor: default; opacity: .6; }
    .refresh-icon { display: inline-block; }
    .refresh-btn.spinning .refresh-icon { animation: hl-spin .8s linear infinite; }

    /* ─── Service rows ──────────────────────────────────────────────────── */
    .svc-list { display: flex; flex-direction: column; gap: 9px; }
    .svc-row { border-radius: 20px; background: var(--ov-035); box-shadow: var(--hairline); transition: background .2s; min-width: 0; }
    .svc-row:hover, .svc-row.open { background: var(--ov-05); }
    .svc-head {
      display: flex; flex-wrap: nowrap; align-items: center; gap: 12px; padding: 12px 16px;
      cursor: pointer; user-select: none; width: 100%; text-align: left; min-width: 0; border-radius: 20px;
    }
    .svc-tile {
      width: 40px; height: 40px; flex: none; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; font: 700 11px var(--font-mono);
      background: var(--ov-06); color: var(--t-sec);
    }
    .svc-info { flex: 1 1 140px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .svc-name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .svc-cat { font: 400 11px var(--font-mono); color: var(--t-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bars { flex: 2 1 90px; min-width: 0; display: flex; align-items: flex-end; gap: 3px; height: 30px; }
    .bar { flex: 1; min-width: 0; border-radius: 99px; position: relative; transition: filter .15s; }
    .bar.ok    { background: oklch(0.62 0.09 158); }
    .bar.warn  { background: oklch(0.78 0.13 75); }
    .bar.down  { background: oklch(0.78 0.13 25); }
    .bar.maint { background: oklch(0.72 0.06 265); }
    .bar.empty { background: var(--ov-06); }
    .bar:not(.empty):hover { filter: brightness(1.15); }
    .bar[data-tip]:hover::after {
      content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      background: var(--bg-sidebar); box-shadow: inset 0 0 0 1px var(--ov-10);
      padding: 6px 10px; border-radius: 12px; font: 400 11px var(--font-mono); color: var(--t-body);
      white-space: nowrap; z-index: 20; pointer-events: none;
    }
    .svc-dot { width: 9px; height: 9px; flex: none; border-radius: 99px; }
    .svc-uptime { width: 64px; flex: none; text-align: right; font: 500 14px var(--font-mono); }
    .chev { flex: none; width: 14px; text-align: center; color: var(--t-faint); font-size: 18px; line-height: 1; transition: transform .22s var(--spring); }
    .svc-row.open .chev { transform: rotate(90deg); color: var(--t-sec); }

    /* ─── Expanded detail ───────────────────────────────────────────────── */
    .svc-detail { display: none; padding: 0 10px 10px; }
    .svc-row.open .svc-detail { display: block; }
    .detail-inset { border-radius: 18px; background: var(--bg-well); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .detail-sec { display: flex; flex-direction: column; gap: 10px; }
    .detail-sec-hdr { display: flex; align-items: center; gap: 10px; }
    .chart-wrap { position: relative; height: 120px; }
    canvas.chart { width: 100%; height: 100%; display: block; }
    .chart-axis { display: flex; justify-content: space-between; gap: 10px; font: 400 10.5px var(--font-mono); color: var(--t-mono); }
    .ev-list { display: flex; flex-direction: column; }
    .ev-item { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--ov-05); font-size: 13px; }
    .ev-item:first-child { border-top: none; padding-top: 2px; }
    .ev-dot { width: 9px; height: 9px; flex: none; border-radius: 99px; }
    .ev-body { flex: 1; min-width: 0; color: var(--t-strong); }
    .ev-when { font: 400 11.5px var(--font-mono); color: var(--t-mono); white-space: nowrap; }
    .ev-empty { font-size: 12.5px; color: var(--t-faint); padding: 2px 0; }

    /* ─── Incident log ──────────────────────────────────────────────────── */
    .panel {
      padding: 22px; border-radius: 28px; background: var(--bg-panel); box-shadow: var(--hairline);
      display: flex; flex-direction: column; gap: 12px; min-width: 0;
    }
    .panel-hdr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .log { display: flex; flex-direction: column; gap: 9px; }
    .log-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 13px 16px;
      border-radius: 20px; background: var(--ov-035); transition: background .18s;
    }
    .log-row:hover { background: var(--ov-07); }
    .log-dot { width: 9px; height: 9px; flex: none; border-radius: 99px; }
    .log-name { width: 200px; flex: none; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-cause { flex: 1; min-width: 160px; font-size: 13px; color: var(--t-sec); }
    .log-when { font: 400 12px var(--font-mono); color: var(--t-mono); white-space: nowrap; }

    /* ─── Empty / loading / error states ───────────────────────────────── */
    .state { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 70px 16px; text-align: center; color: var(--t-faint); font-size: 13.5px; }
    .state .glyph { font-size: 34px; opacity: .3; }
    .state-title { font-size: 20px; font-weight: 600; color: var(--t-body); }
    .state .btn {
      margin-top: 8px; padding: 11px 18px; border-radius: 99px; background: var(--ov-06); color: var(--t-body);
      font-size: 13px; font-weight: 600; transition: background .16s;
    }
    .state .btn:hover { background: var(--ov-11); }
    .state .btn.primary { background: var(--ok); color: var(--on-green); font-weight: 700; }
    .empty-list { padding: 34px 16px; text-align: center; color: var(--t-faint); font-size: 13.5px; border-radius: 20px; background: var(--ov-035); }
    .foot { text-align: center; font: 400 11px var(--font-mono); color: var(--t-mono); padding-top: 8px; }

    /* ─── Responsive ────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      main { padding: 24px 16px 60px; gap: 16px; }
      .banner { padding: 14px 16px; border-radius: 20px; }
      .banner-msg { font-size: 16.5px; }
      .page-hdr h1 { font-size: 22px; }
      .svc-head { flex-wrap: wrap; padding: 12px 14px; row-gap: 10px; }
      .svc-info { flex: 1 1 120px; }
      .bars { flex: 1 1 100%; order: 10; height: 24px; }
      .svc-uptime { width: 60px; font-size: 13.5px; }
      .svc-tile { width: 36px; height: 36px; border-radius: 12px; }
      .panel { padding: 16px; border-radius: 24px; }
      .log-name { width: auto; flex: 1 1 140px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .seg-opt:hover, .refresh-btn:hover { transform: none !important; }
    }
  </style>
</head>
<body>

<main id="root">
  <div class="state"><span>Loading status…</span></div>
</main>

<script>
(function () {
  'use strict';

  // ─── State ──────────────────────────────────────────────────────────────
  const SLUG = location.pathname.split('/')[2] || '';
  let DATA = null;
  let rangeKey = '30d';
  const expanded = new Set();
  let lastRefreshed = null;
  let isRefreshing = false;

  // Ranges. The public API returns only the last 24 hourly entries, so 7d
  // falls back to 7 daily buckets when there is no hourly coverage beyond a day.
  const RANGES = {
    '24h': { slots: 24, bucket: '1 hour',  label: '24h', hours: 24 },
    '7d':  { slots: 28, bucket: '6 hours', label: '7d',  hours: 24 * 7 },
    '30d': { slots: 30, bucket: '1 day',   label: '30d', hours: 24 * 30 }
  };
  const STATUS = {
    online:      { h: 158, label: 'Online' },
    degraded:    { h: 75,  label: 'Degraded' },
    offline:     { h: 25,  label: 'Offline' },
    maintenance: { h: 265, label: 'Maintenance' },
    unknown:     { h: 220, label: 'Unknown' }
  };
  const EVENT = {
    offline:     { h: 25,  label: 'Went offline' },
    degraded:    { h: 75,  label: 'Degraded performance' },
    recovery:    { h: 158, label: 'Recovered' },
    maintenance: { h: 265, label: 'Maintenance' }
  };
  const BANNER = {
    operational: { cls: 'operational', msg: 'All systems operational' },
    degraded:    { cls: 'degraded',    msg: 'Degraded performance' },
    outage:      { cls: 'outage',      msg: 'Partial outage' },
    maintenance: { cls: 'maintenance', msg: 'Scheduled maintenance' }
  };
  const PRESET_HUES = { green: 158, amber: 75, red: 25, blue: 240, purple: 300, pink: 340, slate: 200 };

  // ─── Color helpers (accent formula, copied from app.js) ──────────────────
  const acc  = h => `oklch(0.80 0.13 ${h})`;
  const tint = h => `oklch(0.80 0.13 ${h} / 0.14)`;
  function hueFromHex(hex) {
    const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || '').trim());
    if (!m) return null;
    let h = m[1];
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    const r = lin(parseInt(h.slice(0, 2), 16)), g = lin(parseInt(h.slice(2, 4), 16)), b = lin(parseInt(h.slice(4, 6), 16));
    const l  = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m_ = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s  = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    const A = 1.9779984951 * l - 2.4285922050 * m_ + 0.4505937099 * s;
    const B = 0.0259040371 * l + 0.7827717662 * m_ - 0.8086757660 * s;
    if (Math.abs(A) < 1e-4 && Math.abs(B) < 1e-4) return 200;
    let hue = Math.atan2(B, A) * 180 / Math.PI;
    if (hue < 0) hue += 360;
    return Math.round(hue);
  }
  function hueOf(color) {
    if (!color) return 158;
    if (PRESET_HUES[color] !== undefined) return PRESET_HUES[color];
    const h = hueFromHex(color);
    return h == null ? 158 : h;
  }
  function statusOf(svc) {
    if (svc.maintenance) return 'maintenance';
    return STATUS[svc.status] ? svc.status : 'unknown';
  }
  const statusHue = st => (STATUS[st] || STATUS.unknown).h;

  // ─── Formatting ─────────────────────────────────────────────────────────
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  // Daily keys are UTC calendar days (server TODAY_KEY); format in UTC so the
  // label matches the bucket instead of slipping a day west of UTC.
  const fmtDateUTC = iso => new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  // Hourly keys are 'YYYY-MM-DDTHH' in UTC — parse as UTC, display local.
  const fmtHourKey = key => new Date(key + ':00:00Z').toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric' });
  function relTime(iso) {
    const t = new Date(iso).getTime();
    if (!t) return 'never';
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 5)     return 'just now';
    if (s < 60)    return s + 's ago';
    if (s < 3600)  return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }
  const fmtPct = (n, digits = 1) => (n == null || isNaN(n)) ? '—' : n.toFixed(digits) + '%';
  const plural = (n, one, many) => n === 1 ? one : (many || one + 's');

  // ─── History buckets (mirrors App.bucketsFor / bucketKind / barsHtml) ──
  function mergeEntries(entries, label) {
    const out = { label, online: 0, degraded: 0, offline: 0, maintenance: 0, total: 0 };
    for (const e of entries) {
      out.online += e.online || 0; out.degraded += e.degraded || 0;
      out.offline += e.offline || 0; out.maintenance += e.maintenance || 0; out.total += e.total || 0;
    }
    const denom = out.online + out.degraded + out.offline;
    out.uptime = denom > 0 ? parseFloat((out.online / denom * 100).toFixed(2)) : null;
    return out;
  }
  // Returns { buckets, slots, bucketLabel } — exactly `slots` buckets, oldest → newest,
  // left-padded with { empty: true }.
  function bucketsFor(svc, range) {
    const r = RANGES[range] || RANGES['30d'];
    const hourly = svc.hourlyHistory || [], daily = svc.dailyHistory || [];
    let out = [], slots = r.slots, bucketLabel = r.bucket;
    if (range === '24h') {
      out = hourly.slice(-24).map(e => ({ ...e, label: fmtHourKey(e.ts) }));
    } else if (range === '7d') {
      if (hourly.length > 30) {
        const hours = hourly.slice(-168);
        const groups = [];
        for (let end = hours.length; end > 0; end -= 6) {
          const chunk = hours.slice(Math.max(0, end - 6), end);
          groups.unshift(mergeEntries(chunk, fmtHourKey(chunk[0].ts) + ' +6h'));
        }
        out = groups.slice(-28);
      } else {
        // Only a day of hourly data is published — fall back to daily buckets.
        out = daily.slice(-7).map(e => ({ ...e, label: fmtDateUTC(e.date) }));
        slots = 7; bucketLabel = '1 day';
      }
    } else {
      out = daily.slice(-30).map(e => ({ ...e, label: fmtDateUTC(e.date) }));
    }
    while (out.length < slots) out.unshift({ empty: true });
    return { buckets: out.slice(-slots), slots, bucketLabel };
  }
  function bucketKind(b) {
    if (!b || b.empty) return 'empty';
    if (b.uptime == null) return (b.maintenance > 0 ? 'maint' : 'empty');
    if (b.uptime >= 99) return 'ok';
    if (b.uptime >= 80) return 'warn';
    return 'down';
  }
  function barsHtml(buckets, opts) {
    const minH = opts.minH, maxH = opts.maxH, lowH = opts.lowH;
    return buckets.map(b => {
      const kind = bucketKind(b);
      let h = lowH;
      if (kind === 'ok') h = Math.round(minH + (maxH - minH) * Math.min(1, Math.max(0, (b.uptime - 99) / 1)));
      else if (kind === 'maint') h = Math.round((minH + lowH) / 2);
      const tip = b.empty ? '' : ` data-tip="${esc(b.label)}: ${b.uptime == null ? 'maintenance' : fmtPct(b.uptime, 2)}"`;
      return `<span class="bar ${kind}" style="height:${h}px"${tip}></span>`;
    }).join('');
  }
  function uptimeFor(buckets) {
    let up = 0, denom = 0;
    for (const b of buckets) {
      if (b.empty || b.uptime == null) continue;
      up += b.online || 0; denom += (b.online || 0) + (b.degraded || 0) + (b.offline || 0);
    }
    return denom > 0 ? up / denom * 100 : null;
  }
  const rangeCutoff = () => Date.now() - (RANGES[rangeKey] || RANGES['30d']).hours * 3600 * 1000;
  function eventsFor(svc) {
    const cutoff = rangeCutoff();
    return (svc.events || []).filter(e => new Date(e.ts).getTime() >= cutoff).slice().reverse().slice(0, 20);
  }

  // ─── Render ─────────────────────────────────────────────────────────────
  function render() {
    if (!DATA) return;
    const root = document.getElementById('root');
    const page = DATA.page || {};
    const title = page.name || 'Status';
    document.title = `${title} · Status`;
    const b = BANNER[DATA.overall] || BANNER.operational;
    const updated = lastRefreshed ? 'Updated ' + relTime(lastRefreshed) : '';
    const r = RANGES[rangeKey];

    let html = '';
    if (page.showOverallBanner !== false) {
      html += `<section class="banner ${b.cls}">
        <span class="banner-dot"></span>
        <span class="banner-msg">${esc(b.msg)}</span>
        <span class="banner-meta" data-updated>${esc(updated)}</span>
      </section>`;
    }
    html += `<header class="page-hdr">
      <h1>${esc(title)}</h1>
      ${page.description ? `<p>${esc(page.description)}</p>` : ''}
    </header>`;
    html += `<div class="controls">
      <span class="refreshed" data-updated>${esc(updated)}</span>
      <div class="seg-group" role="group" aria-label="Time range">
        ${Object.keys(RANGES).map(k => `<button type="button" class="seg-opt${rangeKey === k ? ' active' : ''}" data-range="${k}">${RANGES[k].label}</button>`).join('')}
      </div>
      <button type="button" class="refresh-btn${isRefreshing ? ' spinning' : ''}" id="refresh-btn" title="Refresh" aria-label="Refresh"${isRefreshing ? ' disabled' : ''}><span class="refresh-icon">↻</span></button>
    </div>`;

    if (!DATA.services.length) {
      html += `<div class="empty-list">No services on this page yet.</div>`;
    } else {
      html += `<div class="svc-list">${DATA.services.map(rowHtml).join('')}</div>`;
    }
    if (page.showEventLog !== false) html += logHtml();
    html += `<div class="foot">auto-refreshes every minute · last ${esc(r.label)}</div>`;
    root.innerHTML = html;

    root.querySelectorAll('.seg-opt').forEach(btn => btn.addEventListener('click', () => {
      if (rangeKey === btn.dataset.range) return;
      rangeKey = btn.dataset.range;
      render();
    }));
    const refreshBtn = root.querySelector('#refresh-btn');
    if (refreshBtn) refreshBtn.addEventListener('click', () => load(true));
    root.querySelectorAll('.svc-head').forEach(h => h.addEventListener('click', () => {
      const row = h.parentElement, id = row.dataset.id;
      if (expanded.has(id)) { expanded.delete(id); row.classList.remove('open'); h.setAttribute('aria-expanded', 'false'); }
      else { expanded.add(id); row.classList.add('open'); h.setAttribute('aria-expanded', 'true'); drawChart(id); }
    }));
    expanded.forEach(id => drawChart(id));
  }

  function rowHtml(svc) {
    const st = statusOf(svc);
    const hue = statusHue(st);
    const { buckets, bucketLabel } = bucketsFor(svc, rangeKey);
    const up = uptimeFor(buckets);
    const isOpen = expanded.has(svc.id);
    const catHue = svc.category ? hueOf(svc.category.color) : null;
    const tileStyle = catHue == null ? '' : ` style="background:${tint(catHue)};color:${acc(catHue)}"`;
    const first = buckets.find(b => !b.empty);
    const evs = eventsFor(svc);
    return `<div class="svc-row${isOpen ? ' open' : ''}" data-id="${esc(svc.id)}">
      <button type="button" class="svc-head" aria-expanded="${isOpen ? 'true' : 'false'}">
        <span class="svc-tile"${tileStyle}>${esc(svc.abbr || '?')}</span>
        <span class="svc-info">
          <span class="svc-name">${esc(svc.name || '')}</span>
          ${svc.category ? `<span class="svc-cat">${esc(svc.category.name)}</span>` : ''}
        </span>
        <span class="bars" title="${esc(bucketLabel)} per bar">${barsHtml(buckets, { minH: 19, maxH: 30, lowH: 13 })}</span>
        <span class="svc-dot" style="background:${acc(hue)}" title="${esc(STATUS[st].label)}"></span>
        <span class="svc-uptime" style="color:${acc(hue)}">${st === 'maintenance' && up == null ? 'maint' : fmtPct(up, 1)}</span>
        <span class="chev">›</span>
      </button>
      <div class="svc-detail">
        <div class="detail-inset">
          <div class="detail-sec">
            <div class="detail-sec-hdr"><span class="caption">Uptime · last ${esc(RANGES[rangeKey].label)}</span><span class="rule"></span><span class="hint">${esc(bucketLabel)} per point</span></div>
            <div class="chart-wrap"><canvas class="chart" id="chart-${esc(svc.id)}"></canvas></div>
            <div class="chart-axis"><span>${first ? esc(first.label) : ''}</span><span>${rangeKey === '24h' ? 'Now' : 'Today'}</span></div>
          </div>
          <div class="detail-sec">
            <div class="detail-sec-hdr"><span class="caption">Recent events</span><span class="rule"></span><span class="hint">${evs.length ? evs.length + ' in range' : ''}</span></div>
            <div class="ev-list">${evs.length ? evs.map(e => {
              const ev = EVENT[e.type] || { h: 220, label: e.type };
              return `<div class="ev-item"><span class="ev-dot" style="background:${acc(ev.h)}"></span><span class="ev-body">${esc(ev.label)}</span><span class="ev-when" title="${esc(new Date(e.ts).toLocaleString())}">${esc(relTime(e.ts))}</span></div>`;
            }).join('') : `<div class="ev-empty">No events in the last ${esc(RANGES[rangeKey].label)}.</div>`}</div>
          </div>
        </div>
      </div>
    </div>`;
  }

  function logHtml() {
    const cutoff = rangeCutoff();
    const all = [];
    for (const svc of DATA.services) {
      for (const e of (svc.events || [])) {
        if (new Date(e.ts).getTime() >= cutoff) all.push({ ts: e.ts, type: e.type, name: svc.name });
      }
    }
    all.sort((a, b) => new Date(b.ts) - new Date(a.ts));
    const recent = all.slice(0, 50);
    const lbl = RANGES[rangeKey].label;
    const note = recent.length ? `${recent.length} ${plural(recent.length, 'event')} · last ${lbl}` : `all quiet · last ${lbl}`;
    return `<section class="panel">
      <div class="panel-hdr"><span class="caption">Incident log</span><span class="rule"></span><span class="hint">${esc(note)}</span></div>
      ${recent.length ? `<div class="log">${recent.map(e => {
        const ev = EVENT[e.type] || { h: 220, label: e.type };
        return `<div class="log-row">
          <span class="log-dot" style="background:${acc(ev.h)}"></span>
          <span class="log-name">${esc(e.name || '')}</span>
          <span class="log-cause">${esc(ev.label)}</span>
          <span class="log-when" title="${esc(new Date(e.ts).toLocaleString())}">${esc(relTime(e.ts))}</span>
        </div>`;
      }).join('')}</div>` : `<div class="empty-list">No incidents in the last ${esc(lbl)}.</div>`}
    </section>`;
  }

  // ─── Canvas area chart ──────────────────────────────────────────────────
  function drawChart(svcId) {
    const svc = DATA.services.find(s => s.id === svcId);
    if (!svc) return;
    const canvas = document.getElementById('chart-' + svcId);
    if (!canvas) return;
    const hue = statusHue(statusOf(svc));
    const pts = bucketsFor(svc, rangeKey).buckets.filter(b => !b.empty && b.uptime != null).map(b => b.uptime);
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    if (rect.width === 0) return;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;

    if (!pts.length) {
      ctx.fillStyle = 'oklch(0.76 0.01 150)';
      ctx.font = '12px Outfit, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('No data yet', W / 2, H / 2);
      return;
    }
    const padT = 10, padB = 4, plotH = H - padT - padB;
    const xStep = pts.length > 1 ? W / (pts.length - 1) : W;
    const toX = i => pts.length > 1 ? i * xStep : W / 2;
    const toY = v => padT + plotH - (v / 100 * plotH);

    ctx.strokeStyle = 'oklch(1 0 0 / .06)';
    ctx.lineWidth = 1;
    [0, 50, 100].forEach(v => { const y = toY(v); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); });

    const grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
    grad.addColorStop(0, `oklch(0.80 0.13 ${hue} / 0.35)`);
    grad.addColorStop(1, `oklch(0.80 0.13 ${hue} / 0)`);
    ctx.beginPath();
    pts.forEach((v, i) => i === 0 ? ctx.moveTo(toX(i), toY(v)) : ctx.lineTo(toX(i), toY(v)));
    ctx.lineTo(toX(pts.length - 1), padT + plotH);
    ctx.lineTo(toX(0), padT + plotH);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.strokeStyle = acc(hue);
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    pts.forEach((v, i) => i === 0 ? ctx.moveTo(toX(i), toY(v)) : ctx.lineTo(toX(i), toY(v)));
    ctx.stroke();
    if (pts.length === 1) { ctx.beginPath(); ctx.arc(toX(0), toY(pts[0]), 3, 0, Math.PI * 2); ctx.fillStyle = acc(hue); ctx.fill(); }
  }
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => expanded.forEach(id => drawChart(id)), 120);
  });

  // ─── States ─────────────────────────────────────────────────────────────
  function showState(title, msg, action) {
    const root = document.getElementById('root');
    root.innerHTML = `<div class="state"><span class="glyph">◎</span>
      <div class="state-title">${esc(title)}</div><div>${esc(msg)}</div>${action || ''}</div>`;
    const retry = root.querySelector('#retry');
    if (retry) retry.addEventListener('click', () => load(true));
  }

  // ─── Load ───────────────────────────────────────────────────────────────
  async function load(manual) {
    if (!SLUG) return showState('Status page not found', 'Missing slug in URL.');
    if (isRefreshing) return;
    isRefreshing = true;
    const btn = document.getElementById('refresh-btn');
    if (btn) { btn.classList.add('spinning'); btn.disabled = true; }
    const started = Date.now();
    try {
      const res = await fetch('/api/public/status/' + encodeURIComponent(SLUG), { cache: 'no-store' });
      if (res.status === 404) return showState('Status page not found', 'The URL you requested does not match any published status page.');
      if (res.status === 401) return showState('This status page is private', 'Sign in to the dashboard to view it.', '<a class="btn primary" href="/login">Sign in →</a>');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      DATA = await res.json();
      DATA.services = Array.isArray(DATA.services) ? DATA.services : [];
      lastRefreshed = new Date().toISOString();
      render();
    } catch (err) {
      if (DATA) {
        // Keep the last good render; just flag the stale timestamp.
        document.querySelectorAll('[data-updated]').forEach(el => el.textContent = 'Refresh failed · showing data from ' + relTime(lastRefreshed));
      } else {
        showState('Could not load status', err.message || 'Network error', '<button type="button" class="btn" id="retry">Try again</button>');
      }
    } finally {
      const done = () => {
        isRefreshing = false;
        const b = document.getElementById('refresh-btn');
        if (b) { b.classList.remove('spinning'); b.disabled = false; }
      };
      if (manual) setTimeout(done, Math.max(0, 500 - (Date.now() - started))); else done();
    }
  }

  // Keep the "Updated Xs ago" labels live between fetches.
  setInterval(() => {
    if (!lastRefreshed) return;
    const label = 'Updated ' + relTime(lastRefreshed);
    document.querySelectorAll('[data-updated]').forEach(el => { if (el.textContent !== label && !/^Refresh failed/.test(el.textContent)) el.textContent = label; });
  }, 10000);

  // Wall-clock-aligned auto-refresh (every 60s on the minute boundary).
  const PUBLIC_INTERVAL_MS = 60000;
  let autoLoadTimeout = null;
  function scheduleNextLoad() {
    clearTimeout(autoLoadTimeout);
    const nextFire = Math.ceil(Date.now() / PUBLIC_INTERVAL_MS) * PUBLIC_INTERVAL_MS;
    autoLoadTimeout = setTimeout(async () => {
      try { await load(false); } finally { scheduleNextLoad(); }
    }, Math.max(0, nextFire - Date.now()));
  }
  load(false);
  scheduleNextLoad();
})();
</script>
</body>
</html>
